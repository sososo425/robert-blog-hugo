 encoding text sequences, including support for inference-time packing to improve throughput. It handles embedding extraction and optional projection to a different hidden size. Attributes: bert_layer: The underlying Transformer instance. projection: Optional linear projection layer when config.hidden_size differs from the model's native hidden size. \"\"\" def __init__( self, config: Any, from_pretrained: bool = False, cache_dir: Optional[Union[str, Path]] = None ) -> None: \"\"\"Initializes the encoder. Args: config: Configuration object containing model hyperparameters including `model_name`, `hidden_size`, and transformer-specific settings. from_pretrained: If True, loads pretrained weights for the transformer. Defaults to False. cache_dir: Optional directory for caching downloaded models. Defaults to None. \"\"\" super().__init__() self.bert_layer = Transformer(config.model_name, config, from_pretrained, cache_dir=cache_dir) bert_hidden_size = self.bert_layer.model.config.hidden_size if config.hidden_size != bert_hidden_size: self.projection = nn.Linear(bert_hidden_size, config.hidden_size) def resize_token_embeddings(self, new_num_tokens: int, pad_to_multiple_of: Optional[int] = None) -> nn.Embedding: \"\"\"Resizes token embeddings to accommodate new vocabulary size. Args: new_num_tokens: New vocabulary size. pad_to_multiple_of: Optional value to pad vocabulary size to a multiple. Defaults to None. Returns: The resized embedding layer. \"\"\" return self.bert_layer.model.resize_token_embeddings(new_num_tokens, pad_to_multiple_of) def get_input_embeddings(self) -> nn.Embedding: \"\"\"Gets the input embedding layer. Returns: The model's input embedding layer. \"\"\" return self.bert_layer.model.get_input_embeddings() def encode_text( self, input_ids: torch.Tensor, attention_mask: torch.Tensor, *args: Any, **kwargs: Any ) -> torch.Tensor: \"\"\"Encodes input text sequences into contextualized embeddings. Supports inference-time packing to batch multiple variable-length sequences efficiently when packing_config is provided and not in training mode. Args: input_ids: Input token IDs of shape (batch_size, seq_len). attention_mask: Attention mask of shape (batch_size, seq_len) where 1 indicates valid tokens and 0 indicates padding. *args: Additional positional arguments passed to the transformer. **kwargs: Additional keyword arguments including: - packing_config: Optional InferencePackingConfig for efficient batching. - pair_attention_mask: Optional pairwise attention mask for packed sequences. Returns: Token embeddings of shape (batch_size, seq_len, hidden_size). \"\"\" packing_config: Optional[InferencePackingConfig] = kwargs.pop(\"packing_config\", None) pair_attention_mask = kwargs.pop(\"pair_attention_mask\", None) if ( packing_config is not None and not self.training and isinstance(input_ids, torch.Tensor) and isinstance(attention_mask, torch.Tensor) and input_ids.dim() == 2 ): token_embeddings = self._encode_with_packing( input_ids, attention_mask, packing_config, pair_attention_mask, *args, **kwargs, ) else: bert_kwargs = dict(kwargs) if attention_mask is not None: bert_kwargs[\"attention_mask\"] = attention_mask if pair_attention_mask is not None: bert_kwargs[\"pair_attention_mask\"] = pair_attention_mask token_embeddings = self.bert_layer( input_ids=input_ids, **bert_kwargs, ) if hasattr(self, \"projection\"): token_embeddings = self.projection(token_embeddings) return token_embeddings def _encode_with_packing( self, input_ids: torch.Tensor, attention_mask: torch.Tensor, packing_config: InferencePackingConfig, pair_attention_mask: Optional[torch.Tensor], *args: Any, **kwargs: Any, ) -> torch.Tensor: \"\"\"Encodes sequences using inference-time packing for efficiency. Packs multiple variable-length sequences into fewer, more efficient batches to maximize GPU utilization during inference. Short sequences are combined into single packed sequences. Args: input_ids: Input token IDs of shape (batch_size, seq_len). attention_