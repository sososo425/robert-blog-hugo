omputes the average of token embeddings weighted by the attention mask, ignoring padded positions. Args: token_embeddings: Token-level embeddings of shape (batch_size, seq_len, hidden_size). attention_mask: Binary mask of shape (batch_size, seq_len) where 1 indicates valid tokens and 0 indicates padding. Returns: Pooled embeddings of shape (batch_size, hidden_size). \"\"\" input_mask_expanded = attention_mask.unsqueeze(-1).expand(token_embeddings.size()).float() return torch.sum(token_embeddings * input_mask_expanded, 1) / torch.clamp(input_mask_expanded.sum(1), min=1e-9) def encode_labels( self, input_ids: torch.Tensor, attention_mask: torch.Tensor, *args: Any, **kwargs: Any ) -> torch.Tensor: \"\"\"Encodes label sequences into fixed-size embeddings. Processes labels through the dedicated labels encoder and applies mean pooling to produce sentence-level representations. Args: input_ids: Label token IDs of shape (batch_size, seq_len). attention_mask: Attention mask of shape (batch_size, seq_len). *args: Additional positional arguments. **kwargs: Additional keyword arguments (packing_config and pair_attention_mask are removed as they're not supported for labels). Returns: Pooled label embeddings of shape (batch_size, hidden_size). \"\"\" label_kwargs = dict(kwargs) label_kwargs.pop(\"packing_config\", None) label_kwargs.pop(\"pair_attention_mask\", None) label_kwargs[\"attention_mask\"] = attention_mask labels_embeddings = self.labels_encoder(input_ids, *args, **label_kwargs) if hasattr(self, \"labels_projection\"): labels_embeddings = self.labels_projection(labels_embeddings) labels_embeddings = self.mean_pooling(labels_embeddings, attention_mask) return labels_embeddings def forward( self, input_ids: torch.Tensor, attention_mask: torch.Tensor, labels_input_ids: Optional[torch.Tensor] = None, labels_attention_mask: Optional[torch.Tensor] = None, *args: Any, **kwargs: Any, ) -> Tuple[torch.Tensor, torch.Tensor]: \"\"\"Forward pass through the bi-encoder. Encodes both