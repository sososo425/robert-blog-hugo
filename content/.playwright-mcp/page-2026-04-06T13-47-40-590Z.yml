              - region "encoder.py" [ref=e776]:
                - generic [ref=e780]:
                  - textbox "file content" [ref=e783]: "import warnings from typing import Any, Dict, List, Tuple, Union, Optional from pathlib import Path import os import torch from torch import nn from transformers import AutoModel, AutoConfig from transformers.modeling_outputs import BaseModelOutput from ..utils import MissedPackageException, is_module_available from .layers import LayersFuser from ..infer_packing import InferencePackingConfig, unpack_spans, pack_requests # Check for optional dependencies IS_LLM2VEC = is_module_available(\"llm2vec\") IS_PEFT = is_module_available(\"peft\") IS_TURBOT5 = is_module_available(\"turbot5\") IS_FLASHDEBERTA = is_module_available(\"flashdeberta\") if IS_LLM2VEC: from llm2vec.models import GemmaBiModel, LlamaBiModel, Qwen2BiModel, MistralBiModel DECODER_MODEL_MAPPING = { \"MistralConfig\": MistralBiModel, \"LlamaConfig\": LlamaBiModel, \"GemmaConfig\": GemmaBiModel, \"Qwen2Config\": Qwen2BiModel, } else: DECODER_MODEL_MAPPING = {} if IS_TURBOT5: from turbot5.model.modeling import T5EncoderModel as FlashT5EncoderModel from transformers import T5EncoderModel if IS_FLASHDEBERTA: from flashdeberta import FlashDebertaV2Model from transformers import DebertaV2Model if IS_PEFT: from peft import LoraConfig, get_peft_model class Transformer(nn.Module): \"\"\"Flexible transformer wrapper supporting multiple architectures and configurations. This class provides a unified interface for various transformer models including encoder-only (BERT, DeBERTa), encoder-decoder (T5), and decoder-only models (LLaMA, Mistral) with bidirectional adaptations. It handles model initialization, adapter loading, and specialized forward passes for different architectures. Attributes: model: The underlying transformer model instance. layers_fuser: Optional layer fusion module when config.fuse_layers is True. config: Configuration object containing model hyperparameters. \"\"\" def __init__( self, model_name: str, config: Any, from_pretrained: bool = False, labels_encoder: bool = False, cache_dir: Optional[Union[str, Path]] = None, ) -> None: \"\"\"Initializes the transformer wrapper. Args: model_name: Name or path of the pretrained model to load. config: Configuration object containing model hyperparameters. Must have attributes like `encoder_config`, `labels_encoder_config`, `vocab_size`, `_attn_implementation`, and `fuse_layers`. from_pretrained: If True, loads pretrained weights. If False, initializes from config only. Defaults to False. labels_encoder: If True, initializes as a labels encoder using `config.labels_encoder_config`. Defaults to False. cache_dir: Optional directory for caching downloaded models. Defaults to None. Raises: MissedPackageException: If required packages (llm2vec, peft) are not installed when needed for specific model types. \"\"\" super().__init__() if labels_encoder: encoder_config = config.labels_encoder_config else: encoder_config = config.encoder_config if encoder_config is None: encoder_config = AutoConfig.from_pretrained(model_name, cache_dir=cache_dir) if config.vocab_size != -1: encoder_config.vocab_size = config.vocab_size if config._attn_implementation is not None and not labels_encoder: encoder_config._attn_implementation = config._attn_implementation config_name = encoder_config.__class__.__name__ kwargs = {} if config_name in DECODER_MODEL_MAPPING: if not IS_LLM2VEC: raise MissedPackageException( f\"The llm2vec package must be installed to use this decoder model: {config_name}\" ) else: ModelClass = DECODER_MODEL_MAPPING[config_name] custom = True elif config_name in {'T5Config', 'MT5Config'}: custom=True turbot5_type = os.environ.get(\"TURBOT5_ATTN_TYPE\", \"basic\") if turbot5_type and IS_TURBOT5: ModelClass = FlashT5EncoderModel kwargs = {'attention_type': turbot5_type} config.encoder_config.attention_type=turbot5_type else: ModelClass = T5EncoderModel elif config_name in {'DebertaV2Config'}: custom = True if os.environ.get(\"USE_FLASHDEBERTA\", \"\") and IS_FLASHDEBERTA: print('Using FlashDeberta backend.') ModelClass = FlashDebertaV2Model else: ModelClass = DebertaV2Model else: custom = False ModelClass = AutoModel if from_pretrained: self.model = ModelClass.from_pretrained(model_name, **kwargs, trust_remote_code=True) elif not custom: self.model = ModelClass.from_config(encoder_config, trust_remote_code=True) else: self.model = ModelClass(encoder_config, **kwargs) adapter_config_file = Path(model_name) / \"adapter_config.json\" if adapter_config_file.exists(): if not IS_PEFT: warnings.warn( \"Adapter configs were detected, if you want to apply them you need to install peft package.\", stacklevel=2, ) else: adapter_config = LoraConfig.from_pretrained(model_name) self.model = get_peft_model(self.model, adapter_config) if config.fuse_layers: self.layers_fuser = LayersFuser(encoder_config.num_hidden_layers, encoder_config.hidden_size) if labels_encoder: config.labels_encoder_config = encoder_config else: config.encoder_config = encoder_config self.config = config def forward(self, *args: Any, **kwargs: Any) -> torch.Tensor: \"\"\"Forward pass through the transformer model. Handles different attention mask configurations and model architectures, including support for pair attention masks for packed sequences. Args: *args: Variable positional arguments passed to the model. **kwargs: Variable keyword arguments. Special arguments include: - pair_attention_mask: Optional pairwise attention mask of shape (batch_size, seq_len, seq_len) for packed sequences. - attention_mask: Standard attention mask of shape (batch_size, seq_len). - input_ids: Input token IDs of shape (batch_size, seq_len). - Other model-specific arguments. Returns: Encoded representations of shape (batch_size, seq_len, hidden_size). If config.fuse_layers is True, returns fused layer outputs, otherwise returns the last hidden state. \"\"\" pair_attention_mask = kwargs.pop(\"pair_attention_mask\", None) base_attention_mask = kwargs.pop(\"attention_mask\", None) # Extract in