          - paragraph [ref=e189]:
            - text: GLiNER-relex is a unified model for
            - strong [ref=e190]: zero-shot Named Entity Recognition (NER)
            - text: and
            - strong [ref=e191]: Relation Extraction (RE)
            - text: that performs both tasks simultaneously in a single forward pass. Built on the GLiNER architecture, it extends the span-based approach to jointly identify entities and extract relationships between them.
          - heading "✨ Key Features" [level=2] [ref=e192]:
            - link [ref=e193] [cursor=pointer]:
