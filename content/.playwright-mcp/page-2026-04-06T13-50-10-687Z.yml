              - text: ": Simultaneously extracts entities and relations in one forward pass"
            - listitem [ref=e201]:
              - strong [ref=e202]: Zero-Shot
              - text: ": No fine-tuning required — specify entity types and relation types at inference time"
            - listitem [ref=e203]:
              - strong [ref=e204]: Label Descriptions
              - text: ": Supports natural language descriptions for entity labels, improving accuracy by providing richer semantic context to the model"
            - listitem [ref=e205]:
              - strong [ref=e206]: "\"Other\" Entity Type"
              - text: ": Use the special"
              - code [ref=e207]: "\"other\""
              - text: label to extract entities whose types are not explicitly defined but can be inferred from the specified relations
            - listitem [ref=e208]:
              - strong [ref=e209]: Efficient
              - text: ": Single encoder architecture processes both tasks together"
            - listitem [ref=e210]:
              - strong [ref=e211]: Flexible
