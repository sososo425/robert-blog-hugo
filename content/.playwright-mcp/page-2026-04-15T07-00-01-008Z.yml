          - heading "Model Summary" [level=2] [ref=e256]:
            - link [ref=e257] [cursor=pointer]:
              - /url: "#model-summary"
              - img [ref=e259]
            - generic [ref=e261]: Model Summary
          - paragraph [ref=e262]: "ModernBERT is a modernized bidirectional encoder-only Transformer model (BERT-style) pre-trained on 2 trillion tokens of English and code data with a native context length of up to 8,192 tokens. ModernBERT leverages recent architectural improvements such as:"
          - list [ref=e263]:
            - listitem [ref=e264]:
              - strong [ref=e265]: Rotary Positional Embeddings (RoPE)
              - text: for long-context support.
            - listitem [ref=e266]:
              - strong [ref=e267]: Local-Global Alternating Attention
              - text: for efficiency on long inputs.
            - listitem [ref=e268]:
              - strong [ref=e269]: Unpadding and Flash Attention
              - text: for efficient inference.
          - paragraph [ref=e270]: ModernBERT’s native long context length makes it ideal for tasks that require processing long documents, such as retrieval, classification, and semantic search within large corpora. The model was trained on a large corpus of text and code, making it suitable for a wide range of downstream tasks, including code retrieval and hybrid (text + code) semantic search.
          - paragraph [ref=e271]: "It is available in the following sizes:"
          - list [ref=e272]:
            - listitem [ref=e273]:
              - link "ModernBERT-base" [ref=e274] [cursor=pointer]:
                - /url: https://huggingface.co/answerdotai/ModernBERT-base
              - text: "- 22 layers, 149 million parameters"
            - listitem [ref=e275]:
              - link "ModernBERT-large" [ref=e276] [cursor=pointer]:
                - /url: https://huggingface.co/answerdotai/ModernBERT-large
              - text: "- 28 layers, 395 million parameters"
          - paragraph [ref=e277]:
            - text: For more information about ModernBERT, we recommend our
            - link "release blog post" [ref=e278] [cursor=pointer]:
              - /url: https://huggingface.co/blog/modernbert
            - text: for a high-level overview, and our
            - link "arXiv pre-print" [ref=e279] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2412.13663
            - text: for in-depth information.
          - paragraph [ref=e280]:
            - emphasis [ref=e281]:
              - text: ModernBERT is a collaboration between
              - link "Answer.AI" [ref=e282] [cursor=pointer]:
                - /url: https://answer.ai
              - text: ","
              - link "LightOn" [ref=e283] [cursor=pointer]:
                - /url: https://lighton.ai
              - text: ", and friends."
          - heading "Usage" [level=2] [ref=e284]:
            - link [ref=e285] [cursor=pointer]:
              - /url: "#usage"
              - img [ref=e287]
            - generic [ref=e289]: Usage
          - paragraph [ref=e290]:
            - text: You can use these models directly with the
            - code [ref=e291]: transformers
            - text: "library starting from v4.48.0:"
          - generic [ref=e292]:
            - code [ref=e294]: pip install -U transformers>=4.48.0
            - button [ref=e295] [cursor=pointer]:
              - img [ref=e296]
          - paragraph [ref=e300]:
            - text: Since ModernBERT is a Masked Language Model (MLM), you can use the
            - code [ref=e301]: fill-mask
            - text: pipeline or load it via
            - code [ref=e302]: AutoModelForMaskedLM
            - text: . To use ModernBERT for downstream tasks like classification, retrieval, or QA, fine-tune it following standard BERT fine-tuning recipes.
          - paragraph [ref=e303]:
            - strong [ref=e304]: "⚠️ If your GPU supports it, we recommend using ModernBERT with Flash Attention 2 to reach the highest efficiency. To do so, install Flash Attention as follows, then use the model as normal:"
          - generic [ref=e305]:
            - code [ref=e307]: pip install flash-attn
            - button [ref=e308] [cursor=pointer]:
              - img [ref=e309]
          - paragraph [ref=e313]:
            - text: Using
            - code [ref=e314]: AutoModelForMaskedLM
            - text: ":"
          - generic [ref=e315]:
            - code [ref=e317]: "from transformers import AutoTokenizer, AutoModelForMaskedLM model_id = \"answerdotai/ModernBERT-base\" tokenizer = AutoTokenizer.from_pretrained(model_id) model = AutoModelForMaskedLM.from_pretrained(model_id) text = \"The capital of France is [MASK].\" inputs = tokenizer(text, return_tensors=\"pt\") outputs = model(**inputs) # To get predictions for the mask: masked_index = inputs[\"input_ids\"][0].tolist().index(tokenizer.mask_token_id) predicted_token_id = outputs.logits[0, masked_index].argmax(axis=-1) predicted_token = tokenizer.decode(predicted_token_id) print(\"Predicted token:\", predicted_token) # Predicted token: Paris"
            - button [ref=e318] [cursor=pointer]:
              - img [ref=e319]
          - paragraph [ref=e323]: "Using a pipeline:"
          - generic [ref=e324]:
            - code [ref=e326]: import torch from transformers import pipeline from pprint import pprint pipe = pipeline( "fill-mask", model="answerdotai/ModernBERT-base", torch_dtype=torch.bfloat16, ) input_text = "He walked to the [MASK]." results = pipe(input_text) pprint(results)
            - button [ref=e327] [cursor=pointer]:
              - img [ref=e328]
          - paragraph [ref=e332]:
            - strong [ref=e333]: "Note:"
            - text: ModernBERT does not use token type IDs, unlike some earlier BERT models. Most downstream usage is identical to standard BERT models on the Hugging Face Hub, except you can omit the
            - code [ref=e334]: token_type_ids
            - text: parameter.
          - heading "Evaluation" [level=2] [ref=e335]:
            - link [ref=e336] [cursor=pointer]:
              - /url: "#evaluation"
              - img [ref=e338]
            - generic [ref=e340]: Evaluation
          - paragraph [ref=e341]: We evaluate ModernBERT across a range of tasks, including natural language understanding (GLUE), general retrieval (BEIR), long-context retrieval (MLDR), and code retrieval (CodeSearchNet and StackQA).
          - paragraph [ref=e342]:
            - strong [ref=e343]: "Key highlights:"
          - list [ref=e344]:
            - listitem [ref=e345]: On GLUE, ModernBERT-base surpasses other similarly-sized encoder models, and ModernBERT-large is second only to Deberta-v3-large.
            - listitem [ref=e346]: For general retrieval tasks, ModernBERT performs well on BEIR in both single-vector (DPR-style) and multi-vector (ColBERT-style) settings.
            - listitem [ref=e347]: Thanks to the inclusion of code data in its training mixture, ModernBERT as a backbone also achieves new state-of-the-art code retrieval results on CodeSearchNet and StackQA.
          - heading "Base Models" [level=3] [ref=e348]:
