          - paragraph [ref=e431]:
            - text: Also note that if other multilingual models on the model hub claim performance of around 90% on languages other than English, the authors have most likely made a mistake during testing since non of the latest papers shows a multilingual average performance of more than a few points above 80% on XNLI (see
            - link "here" [ref=e432] [cursor=pointer]:
              - /url: https://arxiv.org/pdf/2111.09543.pdf
            - text: or
            - link "here" [ref=e433] [cursor=pointer]:
              - /url: https://arxiv.org/pdf/1911.02116.pdf
            - text: ).
          - heading "Limitations and bias" [level=2] [ref=e434]:
            - link [ref=e435] [cursor=pointer]:
              - /url: "#limitations-and-bias"
              - img [ref=e437]
            - generic [ref=e439]: Limitations and bias
          - paragraph [ref=e440]:
            - text: Please consult the original DeBERTa-V3 paper and literature on different NLI datasets for potential biases. Moreover, note that the multilingual-nli-26lang-2mil7 dataset was created using machine translation, which reduces the quality of the data for a complex task like NLI. You can inspect the data via the Hugging Face
            - link "dataset viewer" [ref=e441] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/MoritzLaurer/multilingual-NLI-26lang-2mil7
            - text: for languages you are interested in. Note that grammatical errors introduced by machine translation are less of an issue for zero-shot classification, for which grammar is less important.
