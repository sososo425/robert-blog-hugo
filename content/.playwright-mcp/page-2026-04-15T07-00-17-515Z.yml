        - generic [ref=e242]:
          - heading "Model card for mDeBERTa-v3-base-xnli-multilingual-nli-2mil7" [level=1] [ref=e243]:
            - link [ref=e244] [cursor=pointer]:
              - /url: "#model-card-for-mdeberta-v3-base-xnli-multilingual-nli-2mil7"
              - img [ref=e246]
            - generic [ref=e248]: Model card for mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
          - heading "Model description" [level=2] [ref=e249]:
            - link [ref=e250] [cursor=pointer]:
              - /url: "#model-description"
              - img [ref=e252]
            - generic [ref=e254]: Model description
          - paragraph [ref=e255]:
            - text: This multilingual model can perform natural language inference (NLI) on 100 languages and is therefore also suitable for multilingual zero-shot classification. The underlying mDeBERTa-v3-base model was pre-trained by Microsoft on the
            - link "CC100 multilingual dataset" [ref=e256] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/cc100
            - text: with 100 languages. The model was then fine-tuned on the
            - link "XNLI dataset" [ref=e257] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/xnli
            - text: and on the
            - link "multilingual-NLI-26lang-2mil7 dataset" [ref=e258] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/MoritzLaurer/multilingual-NLI-26lang-2mil7
            - text: . Both datasets contain more than 2.7 million hypothesis-premise pairs in 27 languages spoken by more than 4 billion people.
          - paragraph [ref=e259]:
            - text: As of December 2021, mDeBERTa-v3-base is the best performing multilingual base-sized transformer model introduced by Microsoft in
            - link "this paper" [ref=e260] [cursor=pointer]:
              - /url: https://arxiv.org/pdf/2111.09543.pdf
            - text: .
          - heading "How to use the model" [level=3] [ref=e261]:
            - link [ref=e262] [cursor=pointer]:
              - /url: "#how-to-use-the-model"
              - img [ref=e264]
            - generic [ref=e266]: How to use the model
          - heading "Simple zero-shot classification pipeline" [level=4] [ref=e267]:
            - link [ref=e268] [cursor=pointer]:
              - /url: "#simple-zero-shot-classification-pipeline"
              - img [ref=e270]
            - generic [ref=e272]: Simple zero-shot classification pipeline
          - generic [ref=e273]:
            - code [ref=e275]: from transformers import pipeline classifier = pipeline("zero-shot-classification", model="MoritzLaurer/mDeBERTa-v3-base-mnli-xnli") sequence_to_classify = "Angela Merkel ist eine Politikerin in Deutschland und Vorsitzende der CDU" candidate_labels = ["politics", "economy", "entertainment", "environment"] output = classifier(sequence_to_classify, candidate_labels, multi_label=False) print(output)
            - button [ref=e276] [cursor=pointer]:
              - img [ref=e277]
          - heading "NLI use-case" [level=4] [ref=e281]:
            - link [ref=e282] [cursor=pointer]:
              - /url: "#nli-use-case"
              - img [ref=e284]
            - generic [ref=e286]: NLI use-case
          - generic [ref=e287]:
            - code [ref=e289]: "from transformers import AutoTokenizer, AutoModelForSequenceClassification import torch device = torch.device(\"cuda\") if torch.cuda.is_available() else torch.device(\"cpu\") model_name = \"MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7\" tokenizer = AutoTokenizer.from_pretrained(model_name) model = AutoModelForSequenceClassification.from_pretrained(model_name) premise = \"Angela Merkel ist eine Politikerin in Deutschland und Vorsitzende der CDU\" hypothesis = \"Emmanuel Macron is the President of France\" input = tokenizer(premise, hypothesis, truncation=True, return_tensors=\"pt\") output = model(input[\"input_ids\"].to(device)) # device = \"cuda:0\" or \"cpu\" prediction = torch.softmax(output[\"logits\"][0], -1).tolist() label_names = [\"entailment\", \"neutral\", \"contradiction\"] prediction = {name: round(float(pred) * 100, 1) for pred, name in zip(prediction, label_names)} print(prediction)"
            - button [ref=e290] [cursor=pointer]:
              - img [ref=e291]
          - heading "Training data" [level=3] [ref=e295]:
            - link [ref=e296] [cursor=pointer]:
              - /url: "#training-data"
              - img [ref=e298]
            - generic [ref=e300]: Training data
          - paragraph [ref=e301]:
            - text: This model was trained on the
            - link "multilingual-nli-26lang-2mil7 dataset" [ref=e302] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/MoritzLaurer/multilingual-NLI-26lang-2mil7
            - text: and the
            - link "XNLI" [ref=e303] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/xnli
            - text: validation dataset.
          - paragraph [ref=e304]:
            - text: The multilingual-nli-26lang-2mil7 dataset contains 2 730 000 NLI hypothesis-premise pairs in 26 languages spoken by more than 4 billion people. The dataset contains 105 000 text pairs per language. It is based on the English datasets
            - link "MultiNLI" [ref=e305] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/multi_nli
            - text: ","
            - link "Fever-NLI" [ref=e306] [cursor=pointer]:
              - /url: https://github.com/easonnie/combine-FEVER-NSMN/blob/master/other_resources/nli_fever.md
            - text: ","
            - link "ANLI" [ref=e307] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/anli
            - text: ","
            - link "LingNLI" [ref=e308] [cursor=pointer]:
              - /url: https://arxiv.org/pdf/2104.07179.pdf
            - text: and
            - link "WANLI" [ref=e309] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/alisawuffles/WANLI
            - text: "and was created using the latest open-source machine translation models. The languages in the dataset are: ['ar', 'bn', 'de', 'es', 'fa', 'fr', 'he', 'hi', 'id', 'it', 'ja', 'ko', 'mr', 'nl', 'pl', 'ps', 'pt', 'ru', 'sv', 'sw', 'ta', 'tr', 'uk', 'ur', 'vi', 'zh'] (see"
            - link "ISO language codes" [ref=e310] [cursor=pointer]:
              - /url: https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes
            - text: . For more details, see the
            - link "datasheet" [ref=e311] [cursor=pointer]:
              - /url: /MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7/blob/main/XXX
            - text: . In addition, a sample of 105 000 text pairs was also added for English following the same sampling method as the other languages, leading to 27 languages.
          - paragraph [ref=e312]: Moreover, for each language a random set of 10% of the hypothesis-premise pairs was added where an English hypothesis was paired with the premise in the other language (and the same for English premises and other language hypotheses). This mix of languages in the text pairs should enable users to formulate a hypothesis in English for a target text in another language.
          - paragraph [ref=e313]:
            - text: The
            - link "XNLI" [ref=e314] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/xnli
            - text: validation set consists of 2490 professionally translated texts from English to 14 other languages (37350 texts in total) (see
            - link "this paper" [ref=e315] [cursor=pointer]:
              - /url: https://arxiv.org/pdf/1809.05053.pdf
            - text: ). Note that XNLI also contains a training set of 14 machine translated versions of the MultiNLI dataset for 14 languages, but this data was excluded due to quality issues with the machine translations from 2018.
          - paragraph [ref=e316]: "Note that for evaluation purposes, three languages were excluded from the XNLI training data and only included in the test data: [\"bg\",\"el\",\"th\"]. This was done in order to test the performance of the model on languages it has not seen during NLI fine-tuning on 27 languages, but only during pre-training on 100 languages - see evaluation metrics below."
          - paragraph [ref=e317]: The total training dataset had a size of 3 287 280 hypothesis-premise pairs.
          - heading "Training procedure" [level=3] [ref=e318]:
            - link [ref=e319] [cursor=pointer]:
              - /url: "#training-procedure"
              - img [ref=e321]
            - generic [ref=e323]: Training procedure
          - paragraph [ref=e324]: mDeBERTa-v3-base-mnli-xnli was trained using the Hugging Face trainer with the following hyperparameters.
          - generic [ref=e325]:
            - code [ref=e327]: "training_args = TrainingArguments( num_train_epochs=3, # total number of training epochs learning_rate=2e-05, per_device_train_batch_size=32, # batch size per device during training gradient_accumulation_steps=2, # to double the effective batch size for warmup_ratio=0.06, # number of warmup steps for learning rate scheduler weight_decay=0.01, # strength of weight decay fp16=False )"
            - button [ref=e328] [cursor=pointer]:
              - img [ref=e329]
          - heading "Eval results" [level=3] [ref=e333]:
            - link [ref=e334] [cursor=pointer]:
              - /url: "#eval-results"
              - img [ref=e336]
            - generic [ref=e338]: Eval results
          - paragraph [ref=e339]:
            - text: The model was evaluated on the XNLI test set in 15 languages (5010 texts per language, 75150 in total) and the English test sets of
            - link "MultiNLI" [ref=e340] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/multi_nli
            - text: ","
            - link "Fever-NLI" [ref=e341] [cursor=pointer]:
              - /url: https://github.com/easonnie/combine-FEVER-NSMN/blob/master/other_resources/nli_fever.md
            - text: ","
            - link "ANLI" [ref=e342] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/anli
            - text: ","
            - link "LingNLI" [ref=e343] [cursor=pointer]:
              - /url: https://arxiv.org/pdf/2104.07179.pdf
            - text: and
            - link "WANLI" [ref=e344] [cursor=pointer]:
              - /url: https://huggingface.co/datasets/alisawuffles/WANLI
            - text: . Note that multilingual NLI models are capable of classifying NLI texts without receiving NLI training data in the specific language (cross-lingual transfer). This means that the model is also able to do NLI on the other 73 languages mDeBERTa was pre-trained on, but performance is most likely lower than for those languages seen during NLI fine-tuning. The performance on the languages ["bg","el","th"] in the table below is a good indicated of this cross-lingual transfer, as these languages were not included in the training data.
