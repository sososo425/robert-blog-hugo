                - text: )
              - text: . Current RAG approaches
              - generic [ref=e1543]:
                - text: Gao et al. (
                - link "2022" [ref=e1544] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2410.05779v3#bib.bib7
                - text: ;
                - link "2023" [ref=e1545] [cursor=pointer]:
