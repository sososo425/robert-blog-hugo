                  - /url: https://arxiv.org/html/2410.05779v3#bib.bib20
                - text: )
              - text: typically embed queries in a vector space to find the nearest context vectors. However, many of these methods rely on fragmented text chunks and only retrieve the top-k contexts, limiting their ability to capture comprehensive global information needed for effective responses.
            - paragraph [ref=e1549]:
              - text: Although recent studies
              - generic [ref=e1550]:
                - text: Edge et al. (
                - link "2024" [ref=e1551] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2410.05779v3#bib.bib4
                - text: )
              - text: have explored using graph structures for knowledge representation, two key limitations persist. First, these approaches often lack the capability for dynamic updates and expansions of the knowledge graph, making it difficult to incorporate new information effectively. In contrast, our proposed model, LightRAG, addresses these challenges by enabling the RAG system to quickly adapt to new information, ensuring the model’s timeliness and accuracy. Additionally, existing methods often rely on brute-force searches for each generated community, which are inefficient for large-scale queries. Our LightRAG framework overcomes this limitation by facilitating rapid retrieval of relevant information from the graph through our proposed dual-level retrieval paradigm, significantly enhancing both retrieval efficiency and response speed.
