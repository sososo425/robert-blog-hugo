          - heading "1 Introduction" [level=2] [ref=e99]:
            - generic [ref=e100]: "1"
            - text: Introduction
          - paragraph [ref=e102]:
            - text: Retrieval-Augmented Generation (RAG) systems have been developed to enhance large language models (LLMs) by integrating external knowledge sources
            - generic [ref=e103]:
              - text: Sudhi et al. (
              - link "2024" [ref=e104] [cursor=pointer]:
                - /url: https://arxiv.org/html/2410.05779v3#bib.bib16
              - text: ); Es et al. (
              - link "2024" [ref=e105] [cursor=pointer]:
