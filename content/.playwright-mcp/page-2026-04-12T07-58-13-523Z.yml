            - paragraph [ref=e1508]:
              - text: We compare the cost of our LightRAG with that of the top-performing baseline, GraphRAG, from two key perspectives. First, we examine the number of tokens and API calls during the indexing and retrieval processes. Second, we analyze these metrics in relation to handling data changes in dynamic environments. The results of this evaluation on the legal dataset are presented in Table
              - link "2" [ref=e1509] [cursor=pointer]:
                - /url: https://arxiv.org/html/2410.05779v3#S4.F2
              - text: . In this context,
              - math [ref=e1510]:
                - generic [ref=e1512]:
                  - generic [ref=e1513]: T
                  - generic [ref=e1514]: extract
              - text: represents the token overhead for entity and relationship extraction,
              - math [ref=e1515]:
                - generic [ref=e1517]:
                  - generic [ref=e1518]: C
                  - generic [ref=e1519]: max
              - text: denotes the maximum number of tokens allowed per API call, and
              - math [ref=e1520]:
                - generic [ref=e1522]:
                  - generic [ref=e1523]: C
                  - generic [ref=e1524]: extract
              - text: indicates the number of API calls required for extraction.
            - paragraph [ref=e1526]:
              - text: In the retrieval phase, GraphRAG generates 1,399 communities, with 610 level-2 communities actively utilized for retrieval in this experiment. Each community report averages 1,000 tokens, resulting in a total token consumption of 610,000 tokens (610 communities
              - math [ref=e1527]:
                - generic [ref=e1529]: ×
              - text: 1,000 tokens per community). Additionally, GraphRAG’s requirement to traverse each community individually leads to hundreds of API calls, significantly increasing retrieval overhead. In contrast, LightRAG optimizes this process by using fewer than 100 tokens for keyword generation and retrieval, requiring only a single API call for the entire process. This efficiency is achieved through our retrieval mechanism, which seamlessly integrates graph structures and vectorized representations for information retrieval, thereby eliminating the need to process large volumes of information upfront.
            - paragraph [ref=e1531]: In the incremental data update phase, designed to address changes in dynamic real-world scenarios, both models exhibit similar overhead for entity and relationship extraction. However, GraphRAG shows significant inefficiency in managing newly added data. When a new dataset of the same size as the legal dataset is introduced, GraphRAG must dismantle its existing community structure to incorporate new entities and relationships, followed by complete regeneration. This process incurs a substantial token cost of approximately 5,000 tokens per community report. Given 1,399 communities, GraphRAG would require around 1,399 × 2 × 5,000 tokens to reconstruct both the original and new community reports—an exorbitant expense that underscores its inefficiency. In contrast, LightRAG seamlessly integrates newly extracted entities and relationships into the existing graph without the need for full reconstruction. This approach results in significantly lower overhead during incremental updates, demonstrating its superior efficiency and cost-effectiveness.
