            - paragraph [ref=e1539]:
              - text: Retrieval-Augmented Generation (RAG) systems enhance LLM inputs by retrieving relevant information from external sources, grounding responses in factual, domain-specific knowledge
              - generic [ref=e1540]:
                - text: Ram et al. (
                - link "2023" [ref=e1541] [cursor=pointer]:
