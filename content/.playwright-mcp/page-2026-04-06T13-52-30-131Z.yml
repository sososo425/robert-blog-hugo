                        - cell "كاتدرائية سانت ماري الأنجليكانيّة في [[هراري]].|thumb|يسار المسيحية في زيمبابوي هي الديانة السائدة والهيمنة، وفي عام 2017 قدر المسح الديموغرافي بواسطة وكالة الإحصاءات الوطنية في زمبابوي أنَّ حوالي 84.1% من مواطني زيمبابوي ينتمون إلى الطوائف المسيحية المختلفة، وحوالي 62% من مسيحيين زيمبابوي متدينين ومترددين على حضور الطقوس المسيحية بشكل متواصل ويحضرون الشعائر الدينية بانتظام. أكبر الطوائف المسيحية هي الكنيسة الرسولية وتليها كنائس مثل الكنيسة الرومانية الكاثوليكية والميثودية؛ فضلًا عن الطوائف الإنجيلية والكنائس الخمسينية التي تعتبر من التجمعات الدينية الأسرع نموًا في الفترة بين عام 2000 وعام 2009. ويلعب الإيمان المسيحي دوراً هاماً في تنظيم المجتمع." [ref=e4730]:
