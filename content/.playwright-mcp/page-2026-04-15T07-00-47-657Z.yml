        - generic [ref=e221]:
          - 'heading "Model description: bge-m3-zeroshot-v2.0" [level=1] [ref=e222]':
            - link [ref=e223] [cursor=pointer]:
              - /url: "#model-description--bge-m3-zeroshot-v20"
              - img [ref=e225]
            - generic [ref=e227]: "Model description: bge-m3-zeroshot-v2.0"
          - heading "zeroshot-v2.0 series of models" [level=2] [ref=e228]:
            - link [ref=e229] [cursor=pointer]:
              - /url: "#zeroshot-v20-series-of-models"
              - img [ref=e231]
            - generic [ref=e233]: zeroshot-v2.0 series of models
          - paragraph [ref=e234]:
            - text: Models in this series are designed for efficient zeroshot classification with the Hugging Face pipeline. These models can do classification without training data and run on both GPUs and CPUs. An overview of the latest zeroshot classifiers is available in my
            - link "Zeroshot Classifier Collection" [ref=e235] [cursor=pointer]:
              - /url: https://huggingface.co/collections/MoritzLaurer/zeroshot-classifiers-6548b4ff407bb19ff5c3ad6f
            - text: .
          - paragraph [ref=e236]:
            - text: The main update of this
            - code [ref=e237]: zeroshot-v2.0
            - text: series of models is that several models are trained on fully commercially-friendly data for users with strict license requirements.
          - paragraph [ref=e238]:
            - text: "These models can do one universal classification task: determine whether a hypothesis is \"true\" or \"not true\" given a text ("
            - code [ref=e239]: entailment
            - text: vs.
            - code [ref=e240]: not_entailment
            - text: ).
            - text: This task format is based on the Natural Language Inference task (NLI). The task is so universal that any classification task can be reformulated into this task by the Hugging Face pipeline.
          - heading "Training data" [level=2] [ref=e241]:
            - link [ref=e242] [cursor=pointer]:
              - /url: "#training-data"
              - img [ref=e244]
            - generic [ref=e246]: Training data
          - paragraph [ref=e247]:
            - text: Models with a "
            - code [ref=e248]: "-c"
            - text: "\" in the name are trained on two types of fully commercially-friendly data:"
          - list [ref=e249]:
            - listitem [ref=e250]:
              - text: Synthetic data generated with
              - link "Mixtral-8x7B-Instruct-v0.1" [ref=e251] [cursor=pointer]:
                - /url: https://huggingface.co/mistralai/Mixtral-8x7B-Instruct-v0.1
              - text: . I first created a list of 500+ diverse text classification tasks for 25 professions in conversations with Mistral-large. The data was manually curated. I then used this as seed data to generate several hundred thousand texts for these tasks with Mixtral-8x7B-Instruct-v0.1. The final dataset used is available in the
              - link "synthetic_zeroshot_mixtral_v0.1" [ref=e252] [cursor=pointer]:
                - /url: https://huggingface.co/datasets/MoritzLaurer/synthetic_zeroshot_mixtral_v0.1
              - text: dataset in the subset
              - code [ref=e253]: mixtral_written_text_for_tasks_v4
              - text: . Data curation was done in multiple iterations and will be improved in future iterations.
            - listitem [ref=e254]:
              - text: "Two commercially-friendly NLI datasets: ("
              - link "MNLI" [ref=e255] [cursor=pointer]:
                - /url: https://huggingface.co/datasets/nyu-mll/multi_nli
              - text: ","
              - link "FEVER-NLI" [ref=e256] [cursor=pointer]:
                - /url: https://huggingface.co/datasets/fever
              - text: ). These datasets were added to increase generalization.
            - listitem [ref=e257]:
              - text: Models without a "
              - code [ref=e258]: "-c"
              - text: "\" in the name also included a broader mix of training data with a broader mix of licenses: ANLI, WANLI, LingNLI, and all datasets in"
              - link "this list" [ref=e259] [cursor=pointer]:
                - /url: https://github.com/MoritzLaurer/zeroshot-classifier/blob/7f82e4ab88d7aa82a4776f161b368cc9fa778001/v1_human_data/datasets_overview.csv
              - text: where
              - code [ref=e260]: used_in_v1.1==True
              - text: .
          - heading "How to use the models" [level=2] [ref=e261]:
            - link [ref=e262] [cursor=pointer]:
              - /url: "#how-to-use-the-models"
              - img [ref=e264]
            - generic [ref=e266]: How to use the models
          - generic [ref=e267]:
            - code [ref=e269]: "#!pip install transformers[sentencepiece] from transformers import pipeline text = \"Angela Merkel is a politician in Germany and leader of the CDU\" hypothesis_template = \"This text is about {}\" classes_verbalized = [\"politics\", \"economy\", \"entertainment\", \"environment\"] zeroshot_classifier = pipeline(\"zero-shot-classification\", model=\"MoritzLaurer/deberta-v3-large-zeroshot-v2.0\") # change the model identifier here output = zeroshot_classifier(text, classes_verbalized, hypothesis_template=hypothesis_template, multi_label=False) print(output)"
            - button [ref=e270] [cursor=pointer]:
              - img [ref=e271]
          - paragraph [ref=e275]:
            - code [ref=e276]: multi_label=False
            - text: forces the model to decide on only one class.
            - code [ref=e277]: multi_label=True
            - text: enables the model to choose multiple classes.
          - heading "Metrics" [level=2] [ref=e278]:
            - link [ref=e279] [cursor=pointer]:
              - /url: "#metrics"
              - img [ref=e281]
            - generic [ref=e283]: Metrics
          - paragraph [ref=e284]:
            - text: The models were evaluated on 28 different text classification tasks with the
            - link "f1_macro" [ref=e285] [cursor=pointer]:
              - /url: https://scikit-learn.org/stable/modules/generated/sklearn.metrics.f1_score.html
            - text: metric. The main reference point is
            - code [ref=e286]: facebook/bart-large-mnli
            - text: which is, at the time of writing (03.04.24), the most used commercially-friendly 0-shot classifier.
          - paragraph [ref=e287]:
            - link "results_aggreg_v2.0" [ref=e288] [cursor=pointer]:
              - /url: https://raw.githubusercontent.com/MoritzLaurer/zeroshot-classifier/main/v2_synthetic_data/results/zeroshot-v2.0-aggreg.png
