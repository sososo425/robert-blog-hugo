          - paragraph [ref=e624]:
            - text: These numbers indicate zeroshot performance, as no data from these datasets was added in the training mix. Note that models without a "
            - code [ref=e625]: "-c"
            - text: "\" in the title were evaluated twice: one run without any data from these 28 datasets to test pure zeroshot performance (the first number in the respective column) and the final run including up to 500 training data points per class from each of the 28 datasets (the second number in brackets in the column, \"fewshot\"). No model was trained on test data."
          - paragraph [ref=e626]:
            - text: "Details on the different datasets are available here:"
            - link "https://github.com/MoritzLaurer/zeroshot-classifier/blob/main/v1_human_data/datasets_overview.csv" [ref=e627] [cursor=pointer]:
              - /url: https://github.com/MoritzLaurer/zeroshot-classifier/blob/main/v1_human_data/datasets_overview.csv
          - heading "When to use which model" [level=2] [ref=e628]:
            - link [ref=e629] [cursor=pointer]:
              - /url: "#when-to-use-which-model"
              - img [ref=e631]
            - generic [ref=e633]: When to use which model
          - list [ref=e634]:
            - listitem [ref=e635]:
              - strong [ref=e636]: deberta-v3-zeroshot vs. roberta-zeroshot
              - text: ": deberta-v3 performs clearly better than roberta, but it is a bit slower. roberta is directly compatible with Hugging Face's production inference TEI containers and flash attention. These containers are a good choice for production use-cases. tl;dr: For accuracy, use a deberta-v3 model. If production inference speed is a concern, you can consider a roberta model (e.g. in a TEI container and"
              - link "HF Inference Endpoints" [ref=e637] [cursor=pointer]:
                - /url: https://ui.endpoints.huggingface.co/catalog
              - text: ).
            - listitem [ref=e638]:
              - strong [ref=e639]: commercial use-cases
              - text: ": models with \""
              - code [ref=e640]: "-c"
              - text: "\" in the title are guaranteed to be trained on only commercially-friendly data. Models without a \""
              - code [ref=e641]: "-c"
              - text: "\" were trained on more data and perform better, but include data with non-commercial licenses. Legal opinions diverge if this training data affects the license of the trained model. For users with strict legal requirements, the models with \""
              - code [ref=e642]: "-c"
              - text: "\" in the title are recommended."
            - listitem [ref=e643]:
              - strong [ref=e644]: Multilingual/non-English use-cases
              - text: ": use"
              - link "bge-m3-zeroshot-v2.0" [ref=e645] [cursor=pointer]:
                - /url: https://huggingface.co/MoritzLaurer/bge-m3-zeroshot-v2.0
              - text: or
              - link "bge-m3-zeroshot-v2.0-c" [ref=e646] [cursor=pointer]:
                - /url: https://huggingface.co/MoritzLaurer/bge-m3-zeroshot-v2.0-c
              - text: . Note that multilingual models perform worse than English-only models. You can therefore also first machine translate your texts to English with libraries like
              - link "EasyNMT" [ref=e647] [cursor=pointer]:
                - /url: https://github.com/UKPLab/EasyNMT
              - text: and then apply any English-only model to the translated data. Machine translation also facilitates validation in case your team does not speak all languages in the data.
            - listitem [ref=e648]:
              - strong [ref=e649]: context window
              - text: ": The"
              - code [ref=e650]: bge-m3
              - text: models can process up to 8192 tokens. The other models can process up to 512. Note that longer text inputs both make the mode slower and decrease performance, so if you're only working with texts of up to 400~ words / 1 page, use e.g. a deberta model for better performance.
            - listitem [ref=e651]:
              - text: The latest updates on new models are always available in the
              - link "Zeroshot Classifier Collection" [ref=e652] [cursor=pointer]:
                - /url: https://huggingface.co/collections/MoritzLaurer/zeroshot-classifiers-6548b4ff407bb19ff5c3ad6f
              - text: .
