          - heading "Flexible usage and \"prompting\"" [level=3] [ref=e702]:
            - link [ref=e703] [cursor=pointer]:
              - /url: "#flexible-usage-and-prompting"
              - img [ref=e705]
            - generic [ref=e707]: Flexible usage and "prompting"
          - paragraph [ref=e708]:
            - text: You can formulate your own hypotheses by changing the
            - code [ref=e709]: hypothesis_template
            - text: of the zeroshot pipeline. Similar to "prompt engineering" for LLMs, you can test different formulations of your
            - code [ref=e710]: hypothesis_template
            - text: and verbalized classes to improve performance.
          - generic [ref=e711]:
            - code [ref=e713]: "from transformers import pipeline text = \"Angela Merkel is a politician in Germany and leader of the CDU\" # formulation 1 hypothesis_template = \"This text is about {}\" classes_verbalized = [\"politics\", \"economy\", \"entertainment\", \"environment\"] # formulation 2 depending on your use-case hypothesis_template = \"The topic of this text is {}\" classes_verbalized = [\"political activities\", \"economic policy\", \"entertainment or music\", \"environmental protection\"] # test different formulations zeroshot_classifier = pipeline(\"zero-shot-classification\", model=\"MoritzLaurer/deberta-v3-large-zeroshot-v2.0\") # change the model identifier here output = zeroshot_classifier(text, classes_verbalized, hypothesis_template=hypothesis_template, multi_label=False) print(output)"
            - button [ref=e714] [cursor=pointer]:
              - img [ref=e715]
