          - list [ref=e228]:
            - listitem [ref=e229]:
              - strong [ref=e230]: "Model name:"
              - text: SauerkrautLM-GLiNER
            - listitem [ref=e231]:
              - strong [ref=e232]: "Backbone:"
              - code [ref=e233]: jhu-clsp/mmBERT-base
              - text: (ModernBERT-style multilingual encoder)
            - listitem [ref=e234]:
              - strong [ref=e235]: "Architecture:"
              - text: GLiNER-style prompted NER (span classification conditioned on textual labels)
            - listitem [ref=e236]:
              - strong [ref=e237]: "Languages (training):"
              - text: English, German, French, Italian, Spanish
            - listitem [ref=e238]:
              - strong [ref=e239]: "Entity types:"
              - text: ~21k distinct entity labels
            - listitem [ref=e240]:
              - strong [ref=e241]: "Objective:"
              - text: Multilingual,
              - strong [ref=e242]: zero-shot
              - text: and
              - strong [ref=e243]: few-shot
              - text: NER with arbitrary label lists
            - listitem [ref=e244]:
              - strong [ref=e245]: "License:"
              - text: MIT
          - paragraph [ref=e246]:
            - text: The model is trained as a
            - strong [ref=e247]: general-purpose multilingual NER model
            - text: ": unlike a PII-only model, it is exposed to many domains (news, encyclopedic text, technical and general content) and a very large label space, making it suitable for both"
            - strong [ref=e248]: broad-domain extraction
            - text: and
            - strong [ref=e249]: specialized taxonomies
            - text: .
