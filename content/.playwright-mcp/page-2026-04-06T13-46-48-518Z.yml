          - heading "SauerkrautLM-GLiNER" [level=1] [ref=e190]:
            - link [ref=e191] [cursor=pointer]:
              - /url: "#sauerkrautlm-gliner"
              - img [ref=e193]
            - generic [ref=e195]: SauerkrautLM-GLiNER
          - paragraph [ref=e196]:
            - text: SauerkrautLM-GLiNER is a multilingual GLiNER-style model for
            - strong [ref=e197]: zero-shot named entity recognition (NER)
            - text: based on the
            - code [ref=e198]: jhu-clsp/mmBERT-base
            - text: backbone (a ModernBERT-style multilingual encoder).
          - paragraph [ref=e199]:
            - text: The model is trained jointly on
            - strong [ref=e200]: English, German, Italian, French, and Spanish
            - text: over roughly
            - strong [ref=e201]: 21k distinct entity types
            - text: ", and is designed for"
            - strong [ref=e202]: prompted / label-list NER
            - text: in real-world multilingual scenarios (documents, logs, PII detection, etc.).
          - paragraph [ref=e203]:
            - text: As a baseline, we compare against
            - strong [ref=e204]:
              - code [ref=e205]: urchade/gliner_multi-v2.1
            - text: ", which is built on"
            - strong [ref=e206]:
              - code [ref=e207]: microsoft/mdeberta-v3-base
            - text: ", a multilingual DeBERTa v3 model that extends BERT/RoBERTa with"
            - strong [ref=e208]: disentangled attention
            - text: and an
            - strong [ref=e209]: enhanced mask decoder
            - text: ", architectural features that improve token-level representations and benefit sequence-labeling tasks such as NER."
          - heading "Demo" [level=1] [ref=e210]:
            - link [ref=e211] [cursor=pointer]:
              - /url: "#demo"
              - img [ref=e213]
            - generic [ref=e215]: Demo
          - blockquote [ref=e216]:
            - paragraph [ref=e217]:
              - text: 🔍
              - strong [ref=e218]: "Demo:"
              - text: "You can try the model directly in the browser via our Hugging Face Space:"
              - strong [ref=e219]:
