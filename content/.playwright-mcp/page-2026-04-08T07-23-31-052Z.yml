                - blockquote [ref=e536]:
                  - paragraph [ref=e537]: The community caught real problems in this README within hours of launch and we want to address them directly.
                  - paragraph [ref=e538]:
                    - strong [ref=e539]: "What we got wrong:"
                  - list [ref=e540]:
                    - listitem [ref=e541]:
                      - paragraph [ref=e542]:
                        - strong [ref=e543]: The AAAK token example was incorrect.
                        - text: We used a rough heuristic (
                        - code [ref=e544]: len(text)//3
                        - text: ") for token counts instead of an actual tokenizer. Real counts via OpenAI's tokenizer: the English example is 66 tokens, the AAAK example is 73. AAAK does not save tokens at small scales — it's designed for"
                        - emphasis [ref=e545]: repeated entities at scale
                        - text: ", and the README example was a bad demonstration of that. We're rewriting it."
                    - listitem [ref=e546]:
                      - paragraph [ref=e547]:
                        - strong [ref=e548]: "\"30x lossless compression\" was overstated."
                        - text: AAAK is a lossy abbreviation system (entity codes, sentence truncation). Independent benchmarks show AAAK mode scores
                        - strong [ref=e549]: 84.2% R@5 vs raw mode's 96.6%
                        - text: "on LongMemEval — a 12.4 point regression. The honest framing is: AAAK is an experimental compression layer that trades fidelity for token density, and"
                        - strong [ref=e550]: the 96.6% headline number is from RAW mode, not AAAK
                        - text: .
                    - listitem [ref=e551]:
                      - paragraph [ref=e552]:
                        - strong [ref=e553]: "\"+34% palace boost\" was misleading."
                        - text: That number compares unfiltered search to wing+room metadata filtering. Metadata filtering is a standard ChromaDB feature, not a novel retrieval mechanism. Real and useful, but not a moat.
                    - listitem [ref=e554]:
                      - paragraph [ref=e555]:
                        - strong [ref=e556]: "\"Contradiction detection\""
                        - text: exists as a separate utility (
                        - code [ref=e557]: fact_checker.py
                        - text: ) but is not currently wired into the knowledge graph operations as the README implied.
                    - listitem [ref=e558]:
                      - paragraph [ref=e559]:
                        - strong [ref=e560]: "\"100% with Haiku rerank\""
                        - text: is real (we have the result files) but the rerank pipeline is not in the public benchmark scripts. We're adding it.
                  - paragraph [ref=e561]:
                    - strong [ref=e562]: "What's still true and reproducible:"
                  - list [ref=e563]:
                    - listitem [ref=e564]:
                      - strong [ref=e565]: 96.6% R@5 on LongMemEval in raw mode
                      - text: ", on 500 questions, zero API calls — independently reproduced on M2 Ultra in under 5 minutes by"
                      - link "@gizmax" [ref=e566] [cursor=pointer]:
                        - /url: https://github.com/milla-jovovich/mempalace/issues/39
                      - text: .
                    - listitem [ref=e567]: Local, free, no subscription, no cloud, no data leaving your machine.
                    - listitem [ref=e568]: The architecture (wings, rooms, closets, drawers) is real and useful, even if it's not a magical retrieval boost.
                  - paragraph [ref=e569]:
                    - strong [ref=e570]: "What we're doing:"
                  - list [ref=e571]:
                    - listitem [ref=e572]: Rewriting the AAAK example with real tokenizer counts and a scenario where AAAK actually demonstrates compression
                    - listitem [ref=e573]:
                      - text: Adding
                      - code [ref=e574]: mode raw / aaak / rooms
                      - text: clearly to the benchmark documentation so the trade-offs are visible
                    - listitem [ref=e575]:
                      - text: Wiring
                      - code [ref=e576]: fact_checker.py
                      - text: into the KG ops so the contradiction detection claim becomes true
                    - listitem [ref=e577]: "Pinning ChromaDB to a tested range (Issue #100), fixing the shell injection in hooks (#110), and addressing the macOS ARM64 segfault (#74)"
                  - paragraph [ref=e578]:
                    - strong [ref=e579]: Thank you to everyone who poked holes in this.
                    - text: Brutal honest criticism is exactly what makes open source work, and it's what we asked for. Special thanks to
                    - link "@panuhorsmalahti" [ref=e580] [cursor=pointer]:
                      - /url: https://github.com/milla-jovovich/mempalace/issues/43
                    - text: ","
                    - link "@lhl" [ref=e581] [cursor=pointer]:
                      - /url: https://github.com/milla-jovovich/mempalace/issues/27
                    - text: ","
                    - link "@gizmax" [ref=e582] [cursor=pointer]:
