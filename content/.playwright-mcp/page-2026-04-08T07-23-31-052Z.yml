                - paragraph [ref=e728]: The layout is fairly simple, though it took a long time to get there.
                - paragraph [ref=e729]:
                  - text: It starts with a
                  - strong [ref=e730]: wing
                  - text: . Every project, person, or topic you're filing gets its own wing in the palace.
                - paragraph [ref=e731]:
                  - text: Each wing has
                  - strong [ref=e732]: rooms
                  - text: connected to it, where information is divided into subjects that relate to that wing — so every room is a different element of what your project contains. Project ideas could be one room, employees could be another, financial statements another. There can be an endless number of rooms that split the wing into sections. The MemPalace install detects these for you automatically, and of course you can personalize it any way you feel is right.
                - paragraph [ref=e733]:
                  - text: Every room has a
                  - strong [ref=e734]: closet
                  - text: connected to it, and here's where things get interesting. We've developed an AI language called
                  - strong [ref=e735]: AAAK
                  - text: . Don't ask — it's a whole story of its own. Your agent learns the AAAK shorthand every time it wakes up. Because AAAK is essentially English, but a very truncated version, your agent understands how to use it in seconds. It comes as part of the install, built into the MemPalace code. In our next update, we'll add AAAK directly to the closets, which will be a real game changer — the amount of info in the closets will be much bigger, but it will take up far less space and far less reading time for your agent.
                - paragraph [ref=e736]:
                  - text: Inside those closets are
                  - strong [ref=e737]: drawers
                  - text: ", and those drawers are where your original files live. In this first version, we haven't used AAAK as a closet tool, but even so, the summaries have shown"
                  - strong [ref=e738]: 96.6% recall
                  - text: in all the benchmarks we've done across multiple benchmarking platforms. Once the closets use AAAK, searches will be even faster while keeping every word exact. But even now, the closet approach has been a huge boon to how much info is stored in a small space — it's used to easily point your AI agent to the drawer where your original file lives. You never lose anything, and all this happens in seconds.
                - paragraph [ref=e739]:
                  - text: There are also
                  - strong [ref=e740]: halls
                  - text: ", which connect rooms within a wing, and"
                  - strong [ref=e741]: tunnels
                  - text: ", which connect rooms from different wings to one another. So finding things becomes truly effortless — we've given the AI a clean and organized way to know where to start searching, without having to look through every keyword in huge folders."
                - paragraph [ref=e742]:
                  - text: You say what you're looking for and boom, it already knows which wing to go to. Just
                  - emphasis [ref=e743]: that
                  - text: in itself would have made a big difference. But this is beautiful, elegant, organic, and most importantly, efficient.
                - generic [ref=e744]:
                  - code [ref=e746]: "┌─────────────────────────────────────────────────────────────┐ │ WING: Person │ │ │ │ ┌──────────┐ ──hall── ┌──────────┐ │ │ │ Room A │ │ Room B │ │ │ └────┬─────┘ └──────────┘ │ │ │ │ │ ▼ │ │ ┌──────────┐ ┌──────────┐ │ │ │ Closet │ ───▶ │ Drawer │ │ │ └──────────┘ └──────────┘ │ └─────────┼──────────────────────────────────────────────────┘ │ tunnel │ ┌─────────┼──────────────────────────────────────────────────┐ │ WING: Project │ │ │ │ │ ┌────┴─────┐ ──hall── ┌──────────┐ │ │ │ Room A │ │ Room C │ │ │ └────┬─────┘ └──────────┘ │ │ │ │ │ ▼ │ │ ┌──────────┐ ┌──────────┐ │ │ │ Closet │ ───▶ │ Drawer │ │ │ └──────────┘ └──────────┘ │ └─────────────────────────────────────────────────────────────┘"
                  - button "Copy" [ref=e748] [cursor=pointer]:
                    - img [ref=e749]
                - paragraph [ref=e752]:
                  - strong [ref=e753]: Wings
                  - text: — a person or project. As many as you need.
                  - strong [ref=e754]: Rooms
                  - text: — specific topics within a wing. Auth, billing, deploy — endless rooms.
                  - strong [ref=e755]: Halls
                  - text: — connections between related rooms
                  - emphasis [ref=e756]: within
                  - text: the same wing. If Room A (auth) and Room B (security) are related, a hall links them.
                  - strong [ref=e757]: Tunnels
                  - text: — connections
                  - emphasis [ref=e758]: between
                  - text: wings. When Person A and a Project both have a room about "auth," a tunnel cross-references them automatically.
                  - strong [ref=e759]: Closets
                  - text: — summaries that point to the original content. (In v3.0.0 these are plain-text summaries; AAAK-encoded closets are coming in a future update — see
                  - 'link "Task #30" [ref=e760] [cursor=pointer]':
                    - /url: https://github.com/milla-jovovich/mempalace/issues/30
                  - text: .)
                  - strong [ref=e761]: Drawers
                  - text: — the original verbatim files. The exact words, never summarized.
