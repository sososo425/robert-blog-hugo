                      - img [ref=e480]
                  - paragraph [ref=e482]: Every conversation you have with an AI — every decision, every debugging session, every architecture debate — disappears when the session ends. Six months of work, gone. You start over every time.
                  - paragraph [ref=e483]:
                    - text: Other memory systems try to fix this by letting AI decide what's worth remembering. It extracts "user prefers Postgres" and throws away the conversation where you explained
                    - emphasis [ref=e484]: why
                    - text: ". MemPalace takes a different approach:"
                    - strong [ref=e485]: store everything, then make it findable.
                  - paragraph [ref=e486]:
                    - strong [ref=e487]: The Palace
                    - text: "— Ancient Greek orators memorized entire speeches by placing ideas in rooms of an imaginary building. Walk through the building, find the idea. MemPalace applies the same principle to AI memory: your conversations are organized into wings (people and projects), halls (types of memory), and rooms (specific ideas). No AI decides what matters — you keep every word, and the structure gives you a navigable map instead of a flat search index."
                  - paragraph [ref=e488]:
                    - strong [ref=e489]: Raw verbatim storage
                    - text: — MemPalace stores your actual exchanges in ChromaDB without summarization or extraction. The 96.6% LongMemEval result comes from this raw mode. We don't burn an LLM to decide what's "worth remembering" — we keep everything and let semantic search find it.
                  - paragraph [ref=e490]:
                    - strong [ref=e491]: AAAK (experimental)
                    - text: — A lossy abbreviation dialect for packing repeated entities into fewer tokens at scale. Readable by any LLM that reads text — Claude, GPT, Gemini, Llama, Mistral — no decoder needed.
                    - strong [ref=e492]: AAAK is a separate compression layer, not the storage default
                    - text: ", and on the LongMemEval benchmark it currently regresses vs raw mode (84.2% vs 96.6%). We're iterating. See the"
                    - link "note above" [ref=e493] [cursor=pointer]:
                      - /url: "#a-note-from-milla--ben--april-7-2026"
                    - text: for the honest status.
                  - paragraph [ref=e494]:
                    - strong [ref=e495]: Local, open, adaptable
                    - text: — MemPalace runs entirely on your machine, on any data you have locally, without using any external API or services. It has been tested on conversations — but it can be adapted for different types of datastores. This is why we're open-sourcing it.
