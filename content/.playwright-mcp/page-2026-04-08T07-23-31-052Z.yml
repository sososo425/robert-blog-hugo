                  - heading "AAAK Dialect (experimental)" [level=3] [ref=e846]
                  - 'link "Permalink: AAAK Dialect (experimental)" [ref=e847] [cursor=pointer]':
                    - /url: "#aaak-dialect-experimental"
                    - img [ref=e848]
                - paragraph [ref=e850]:
                  - text: AAAK is a lossy abbreviation system — entity codes, structural markers, and sentence truncation — designed to pack repeated entities and relationships into fewer tokens at scale. It is
                  - strong [ref=e851]: readable by any LLM that reads text
                  - text: (Claude, GPT, Gemini, Llama, Mistral) without a decoder, so a local model can use it without any cloud dependency.
                - paragraph [ref=e852]:
                  - strong [ref=e853]: "Honest status (April 2026):"
                - list [ref=e854]:
                  - listitem [ref=e855]:
                    - strong [ref=e856]: AAAK is lossy, not lossless.
                    - text: It uses regex-based abbreviation, not reversible compression.
                  - listitem [ref=e857]:
                    - strong [ref=e858]: It does not save tokens at small scales.
                    - text: Short text already tokenizes efficiently. AAAK overhead (codes, separators) costs more than it saves on a few sentences.
                  - listitem [ref=e859]:
                    - strong [ref=e860]: It can save tokens at scale
                    - text: — in scenarios with many repeated entities (a team mentioned hundreds of times, the same project across thousands of sessions), the entity codes amortize.
                  - listitem [ref=e861]:
                    - strong [ref=e862]: AAAK currently regresses LongMemEval
                    - text: vs raw verbatim retrieval (84.2% R@5 vs 96.6%). The 96.6% headline number is from
                    - strong [ref=e863]: raw mode
                    - text: ", not AAAK mode."
                  - listitem [ref=e864]:
                    - strong [ref=e865]: The MemPalace storage default is raw verbatim text in ChromaDB
                    - text: — that's where the benchmark wins come from. AAAK is a separate compression layer for context loading, not the storage format.
                - paragraph [ref=e866]:
                  - text: We're iterating on the dialect spec, adding a real tokenizer for stats, and exploring better break points for when to use it. Track progress in
                  - 'link "Issue #43" [ref=e867] [cursor=pointer]':
                    - /url: https://github.com/milla-jovovich/mempalace/issues/43
                  - text: and
