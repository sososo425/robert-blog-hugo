            - link "Demian Gholipour Ghalandari" [ref=e46] [cursor=pointer]:
              - /url: https://arxiv.org/search/cs?searchtype=author&query=Ghalandari,+D+G
          - blockquote [ref=e47]: We introduce GLiREL (Generalist Lightweight model for zero-shot Relation Extraction), an efficient architecture and training paradigm for zero-shot relation classification. Inspired by recent advancements in zero-shot named entity recognition, this work presents an approach to efficiently and accurately predict zero-shot relationship labels between multiple entities in a single forward pass. Experiments using the FewRel and WikiZSL benchmarks demonstrate that our approach achieves state-of-the-art results on the zero-shot relation classification task. In addition, we contribute a protocol for synthetically-generating datasets with diverse relation labels.
