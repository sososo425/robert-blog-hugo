                - text: "import spacy import glirel # Load a blank spaCy model or an existing one nlp = spacy.load('en_core_web_sm') # Add the GLiREL component to the pipeline nlp.add_pipe(\"glirel\", after=\"ner\") # Now you can use the pipeline with the GLiREL component text = \"Apple Inc. was founded by Steve Jobs, Steve Wozniak, and Ronald Wayne in April 1976. The company is headquartered in Cupertino, California.\" labels = {\"glirel_labels\": { 'co-founder': {\"allowed_head\": [\"PERSON\"], \"allowed_tail\": [\"ORG\"]}, 'country of origin': {\"allowed_head\": [\"PERSON\", \"ORG\"], \"allowed_tail\": [\"LOC\", \"GPE\"]}, 'licensed to broadcast to': {\"allowed_head\": [\"ORG\"]}, 'no relation': {}, 'parent': {\"allowed_head\": [\"PERSON\"], \"allowed_tail\": [\"PERSON\"]}, 'followed by': {\"allowed_head\": [\"PERSON\", \"ORG\"], \"allowed_tail\": [\"PERSON\", \"ORG\"]}, 'located in or next to body of water': {\"allowed_head\": [\"LOC\", \"GPE\", \"FAC\"], \"allowed_tail\": [\"LOC\", \"GPE\"]}, 'spouse': {\"allowed_head\": [\"PERSON\"], \"allowed_tail\": [\"PERSON\"]}, 'child': {\"allowed_head\": [\"PERSON\"], \"allowed_tail\": [\"PERSON\"]}, 'founder': {\"allowed_head\": [\"PERSON\"], \"allowed_tail\": [\"ORG\"]}, 'headquartered in': {\"allowed_head\": [\"ORG\"], \"allowed_tail\": [\"LOC\", \"GPE\", \"FAC\"]}, 'acquired by': {\"allowed_head\": [\"ORG\"], \"allowed_tail\": [\"ORG\", \"PERSON\"]}, 'subsidiary of': {\"allowed_head\": [\"ORG\"], \"allowed_tail\": [\"ORG\", \"PERSON\"]}, } } # Add the labels to the pipeline at inference time docs = list( nlp.pipe([(text, labels)], as_tuples=True) ) relations = docs[0][0]._.relations print('Number of relations:', len(relations)) sorted_data_desc = sorted(relations, key=lambda x: x['score'], reverse=True) print(\"\\nDescending Order by Score:\") for item in sorted_data_desc: print("
