                  - textbox "file content" [ref=e521]: "import argparse import json from pathlib import Path import re import os from typing import Dict, Optional, Union import numpy as np import torch import torch.nn.functional as F import yaml import time from tqdm import tqdm import glirel from glirel.modules.layers import LstmSeq2SeqEncoder, ScorerLayer, FilteringLayer, RefineLayer from glirel.modules.base import InstructBase from glirel.modules.evaluator import greedy_search, RelEvaluator from glirel.modules.span_rep import SpanRepLayer from glirel.modules.rel_rep import RelRepLayer from glirel.modules.token_rep import TokenRepLayer from glirel.modules import loss_functions from torch import nn from torch.nn.utils.rnn import pad_sequence from huggingface_hub import PyTorchModelHubMixin, hf_hub_download from huggingface_hub.utils import HfHubHTTPError from typing import List, Dict, Union from loguru import logger class GLiREL(InstructBase, PyTorchModelHubMixin): def __init__(self, config): super().__init__(config) self.config = config # [REL] token self.rel_token = \"[REL]\" self.sep_token = \"[SEP]\" label_embed_strategies = ['ent_token', 'label', 'both'] assert self.config.label_embed_strategy in label_embed_strategies, f\"Invalid label_embed_strategy: {self.config.label_embed_strategy}. Must be one of {label_embed_strategies}\" self.positive_weight = getattr(self.config, 'positive_weight', 2.0) # weight for positive labels (Default: 2.0) self.negative_weight = getattr(self.config, 'negative_weight', 1.0) # weight for negative labels (Default: 1.0) self.threshold_search_metric = getattr(self.config, 'threshold_search_metric', 'micro_f1') # metric to use for threshold search (Default: 'micro_f1') # usually a pretrained bidirectional transformer, returns first subtoken representation # add_tokens = [self.rel_token, self.sep_token] add_tokens = [self.rel_token, self.sep_token, self.base_config.entity_start_token, self.base_config.entity_end_token] if hasattr(self.base_config, \"entity_start_token\"): add_tokens += self.base_config.entity_start_token, self.base_config.entity_end_token self.token_rep_layer = TokenRepLayer(model_name=config.model_name, fine_tune=config.fine_tune, subtoken_pooling=config.subtoken_pooling, hidden_size=config.hidden_size, add_tokens=add_tokens) # hierarchical representation of tokens (zaratiana et al, 2022) # https://arxiv.org/pdf/2203.14710.pdf self.rnn = LstmSeq2SeqEncoder( input_size=config.hidden_size, hidden_size=config.hidden_size // 2, num_layers=1, bidirectional=True, ) self.span_rep_layer = RelRepLayer( rel_mode=config.rel_mode, span_mode=config.span_marker_mode, hidden_size=config.hidden_size, max_width=config.max_width, dropout=config.dropout, ) # prompt representation (FFN) self.prompt_rep_layer = nn.Sequential( nn.Linear(config.hidden_size, config.hidden_size * 4), nn.Dropout(config.dropout), nn.ReLU(), nn.Linear(config.hidden_size * 4, config.hidden_size) ) # refine relation representation if hasattr(config, \"refine_relation\") and config.refine_relation: self.refine_relation = RefineLayer( config.hidden_size, config.hidden_size // 64, num_layers=1, ffn_mul=config.ffn_mul, dropout=config.dropout, read_only=True ) # refine prompt representation if hasattr(config, \"refine_prompt\") and config.refine_prompt: self.refine_prompt = RefineLayer( config.hidden_size, config.hidden_size // 64, num_layers=2, ffn_mul=config.ffn_mul, dropout=config.dropout, read_only=True ) # coreference resolution if getattr(config, \"coref_classifier\", False): self.coref_classifier = nn.Sequential( nn.Linear(config.hidden_size, config.hidden_size), nn.Dropout(config.dropout), nn.ReLU(), nn.Linear(config.hidden_size, 1) ) # scoring layer self.scorer = ScorerLayer(config.scorer, hidden_size=config.hidden_size, dropout=config.dropout) def get_optimizer(self, lr_encoder, lr_others, freeze_token_rep=False): \"\"\" Parameters: - lr_encoder: Learning rate for the encoder layer. - lr_others: Learning rate for all other layers. - freeze_token_rep: whether the token representation layer should be frozen. \"\"\" param_groups = [ # encoder {'params': self.rnn.parameters(), 'lr': lr_others}, {'params': self.span_rep_layer.parameters(), 'lr': lr_others}, {'params': self.prompt_rep_layer.parameters(), 'lr': lr_others}, {\"params\": self._rel_filtering.parameters(), \"lr\": lr_others}, {'params': self.scorer.parameters(), 'lr': lr_others} ] if not freeze_token_rep: # If token_rep_layer should not be frozen, add it to the optimizer with its learning rate param_groups.append({'params': self.token_rep_layer.parameters(), 'lr': lr_encoder}) else: # If token_rep_layer should be frozen, explicitly set requires_grad to False for its parameters for param in self.token_rep_layer.parameters(): param.requires_grad = False optimizer = torch.optim.AdamW(param_groups) return optimizer def compute_score(self, x): span_idx = x['span_idx'] * x['span_mask'].unsqueeze(-1).to(self.device) # ([B, num_possible_spans, 2]) * ([B, num_possible_spans, 1]) new_length = x['seq_length'].clone() new_tokens = [] all_len_prompt = [] num_classes_all = [] batch_size = x['seq_length'].size(0) # add prompt to the tokens for i in range(batch_size): all_types_i = list(x['classes_to_id'][i].keys()) # multiple entity types in all_types. Prompt is appended at the start of tokens entity_prompt = [] num_classes_all.append(len(all_types_i)) # add enity types to prompt for relation_type in all_types_i: entity_prompt.append(self.rel_token) # [REL] token entity_prompt.append(relation_type) # relation type entity_prompt.append(self.sep_token) # [SEP] token # prompt format: # [REL] relation_type [REL] relation_type ... [REL] relation_type [SEP] # add prompt to the tokens tokens_p = entity_prompt + x['tokens'][i] # input format: # [REL] relation_type_1 [REL] relation_type_2 ... [REL] relation_type_m [SEP] token_1 token_2 ... token_n # update length of the sequence (add prompt length to the original length) new_length[i] = new_length[i] + len(entity_prompt) # update tokens new_tokens.append(tokens_p) # store prompt length all_len_prompt.append(len(entity_prompt)) # create a mask using num_classes_all (False, if it exceeds the number of classes, True otherwise) max_num_classes = max(num_classes_all) rel_type_mask = torch.arange(max_num_classes).unsqueeze(0).expand(len(num_classes_all), -1).to( x['span_mask'].device) rel_type_mask = rel_type_mask < torch.tensor(num_classes_all).unsqueeze(-1).to( x['span_mask'].device) # [batch_size, max_num_classes] # compute all token representations bert_output = self.token_rep_layer(new_tokens, new_length) word_rep_w_prompt = bert_output[\"embeddings\"] # embeddings for all tokens (with prompt) mask_w_prompt = bert_output[\"mask\"] # mask for all tokens (with prompt) # get word representation (after [SEP]), mask (after [SEP]) and relation type representation (before [SEP]) word_rep = [] # word representation (after [SEP]) mask = [] # mask (after [SEP]) rel_type_rep = [] # relation type representation (before [SEP]) for i in range(batch_size): prompt_entity_length = all_len_prompt[i] # length of prompt for this example # get word representation (after [SEP]) word_rep.append(word_rep_w_prompt[i, prompt_entity_length:prompt_entity_length + x['seq_length'][i]]) # get mask (after [SEP]) mask.append(mask_w_prompt[i, prompt_entity_length:prompt_entity_length + x['seq_length'][i]]) # get entity type representation (before [SEP]) relation_rep = word_rep_w_prompt[i, :prompt_entity_length - 1] # remove [SEP] if self.config.label_embed_strategy == 'ent_token': # Only use class token ([REL]) embeddings (every second element starting from 0) relation_rep = relation_rep[0::2] elif self.config.label_embed_strategy == 'label': # Only use label embeddings (every second element starting from 1) relation_rep = relation_rep[1::2] elif self.config.label_embed_strategy == 'both': # Interleave [REL] tokens and label embeddings relation_rep = relation_rep.reshape(-1, 2, relation_rep.shape[-1]).mean(dim=1) # Take the mean of each [REL] and label embedding pair rel_type_rep.append(relation_rep) # padding for word_rep, mask and rel_type_rep word_rep = pad_sequence(word_rep, batch_first=True) # [B, seq_len, D] mask = pad_sequence(mask, batch_first=True) # [B, seq_len] rel_type_rep = pad_sequence(rel_type_rep, batch_first=True) # [B, len_types, D] # compute span representation word_rep = self.rnn(word_rep, mask) # ([B, seq_length, D]) rel_rep = self.span_rep_layer(word_rep, span_idx=span_idx, relations_idx=x['relations_idx']) # ([B, num_pairs, D]) # compute final entity type representation (FFN) rel_type_rep = self.prompt_rep_layer(rel_type_rep) # (B, len_types, D) num_classes = rel_type_rep.shape[1] # number of relation types # refine relation representation ############################################## relation_classes = x['rel_label'] # [B, num_entity_pairs] rel_rep_mask = relation_classes > 0 ################################################################################ if hasattr(self, \"refine_relation\"): # refine relation representation rel_rep = self.refine_relation( rel_rep, word_rep, rel_rep_mask, mask ) if hasattr(self, \"refine_prompt\"): # refine relation representation with relation type representation ############ rel_type_rep = self.refine_prompt( rel_type_rep, rel_rep, rel_type_mask, rel_rep_mask ) ################################################################################ # Coreference Resolution ############################## if hasattr(self, \"coref_classifier\"): coref_scores = self.coref_classifier(rel_rep) # (B, num_pairs, 1) else: coref_scores = None ####################################################### # similarity score scores = self.scorer(rel_rep, rel_type_rep) # ([B, num_pairs, num_classes]) return scores, num_classes, rel_type_mask, coref_scores # ([B, num_pairs, num_classes]), num_classes, ([B, num_classes]), ([B, num_pairs, 1]) def compute_coref_loss(self, coref_scores, coref_ground_truth): coref_loss = F.binary_cross_entropy_with_logits(coref_scores, coref_ground_truth) return coref_loss def compute_relation_loss(self, logits_label, labels_one_hot): if self.config.loss_func == \"binary_cross_entropy_loss\": # compute loss (without reduction) all_losses = F.binary_cross_entropy_with_logits( logits_label, labels_one_hot, reduction='none' ) elif self.config.loss_func == \"focal_loss\": # might make it better at long-tail, but overall metrics may become worse all_losses = loss_functions.focal_loss_with_logits( logits_label, labels_one_hot, alpha=self.config.alpha, gamma=self.config.gamma, reduction='none' ) else: raise ValueError(f\"Invalid loss function: {self.config.loss_func}\") return all_losses def forward(self, x): # compute span representation scores, num_classes, rel_type_mask, coref_scores = self.compute_score(x) batch_size = scores.size(0) # loss for filtering classifier logits_label = scores.view(-1, num_classes) labels = x['rel_label'].view(-1) # [B * num_entity_pairs] # mask for coreference and relation labels coref_mask = (labels <= -50) labels[coref_mask] = (labels[coref_mask] // -50).long() rel_mask = (labels != -1) # Exclude padding (and coreference) labels # separate labels for relation classification rel_labels = labels.masked_fill(~rel_mask, 0) # Set non-relation labels to 0 # one-hot encoding labels_one_hot = torch.zeros(labels.size(0), num_classes + 1, dtype=torch.float32).to(scores.device) # ([batch_size * num_spans, num_classes + 1]) labels_one_hot.scatter_(1, rel_labels.unsqueeze(1), 1) # Set the corresponding index to 1 labels_one_hot = labels_one_hot[:, 1:] # Remove the first column # Shape of labels_one_hot: (batch_size * num_spans, num_classes) all_losses = self.compute_relation_loss(logits_label, labels_one_hot) # Mask and weight relation classification loss # mask loss using rel_type_mask (B, C) masked_loss = all_losses.view(batch_size, -1, num_classes) * rel_type_mask.unsqueeze(1) # ([B, L*K, num_classes]) * ([B, 1, num_classes]) all_losses