e results per threshold rels_per_threshold = {} for thresh in threshold: triggered_relations = probabilities > thresh # Shape: [batch_size, num_pairs, num_classes] # Build a mask for valid class indices batch_sizes = torch.tensor([len(types) for types in types_list], device=probabilities.device) class_mask = torch.arange(max_num_classes, device=probabilities.device).unsqueeze(0).unsqueeze(0) < batch_sizes.unsqueeze(1).unsqueeze(2) triggered_relations &= class_mask # Get indices where relations are triggered batch_indices, pair_indices, class_indices = torch.nonzero(triggered_relations, as_tuple=True) if batch_indices.numel() == 0: rels = [[] for _ in range(len(x[\"tokens\"]))] rels_per_threshold[thresh] = rels continue scores = probabilities[batch_indices, pair_indices, class_indices] # Map class indices to actual class IDs class_ids = padded_types_tensor[batch_indices, class_indices] # Remove invalid class IDs (i.e., where class_id == -1) valid_class_mask = class_ids != -1 batch_indices = batch_indices[valid_class_mask] pair_indices = pair_indices[valid_class_mask] class_ids = class_ids[valid_class_mask] scores = scores[valid_class_mask] if batch_indices.numel() == 0: rels = [[] for _ in range(len(x[\"tokens\"]))] rels_per_threshold[thresh] = rels continue entity_pairs = padded_relations_idx[batch_indices, pair_indices] # Build a mask for valid entity pairs (entity_pair does not contain -1) valid_entity_mask = (entity_pairs != -1).all(dim=tuple(range(1, entity_pairs.dim()))) batch_indices = batch_indices[valid_entity_mask] pair_indices = pair_indices[valid_entity_mask] entity_pairs = entity_pairs[valid_entity_mask] class_ids = class_ids[valid_entity_mask] scores = scores[valid_entity_mask] if batch_indices.numel() == 0: rels = [[] for _ in range(len(x[\"tokens\"]))] rels_per_threshold[thresh] = rels continue class_ids_cpu = class_ids.cpu() relation_types = [id_to_class_name[class_id.item()] for class_id in class_ids_cpu] # Collect relations per example rels = [[] for _ in range(len(x[\"tokens\"]))] batch_indices_cpu = batch_indices.cpu() entity_pairs_cpu = entity_pairs.cpu() scores_cpu = scores.cpu() for idx in range(batch_indices.size(0)): i = batch_indices_cpu[idx].item() entity_pair = entity_pairs_cpu[idx].tolist() relation_type = relation_types[idx] score = scores_cpu[idx].item() rels[i].append((entity_pair, relation_type, score)) rels_per_threshold[thresh] = rels if len(threshold) > 1: preds = rels_per_threshold else: preds = rels_per_threshold[threshold[0]] if return_loss: return {\"predictions\": preds, \"loss\": loss_dict} else: return preds def predict_relations(self, text, labels, flat_ner=True, threshold=0.5, ner=None, ground_truth_relations=None, top_k=-1): output = self.batch_predict_relations([text], labels, flat_ner=flat_ner, threshold=threshold, ner=[ner], ground_truth_relations=[ground_truth_relations], top_k=top_k) if isinstance(output, list): return output[0] else: return output['predictions'][0], output['loss'] def batch_predict_relations( self, texts, labels, flat_ner=True, threshold=0.5, ner=None, ground_truth_relations=None, top_k=-1 ): \"\"\" Predict relations for a batch of texts. \"\"\" all_tokens = [] all_start_token_idx_to_text_idx = [] all_end_token_idx_to_text_idx = [] return_loss = False for text in texts: tokens = [] start_token_idx_to_text_idx = [] end_token_idx_to_text_idx = [] if isinstance(text, str): for match in re.finditer(r'\\w+(?:[-_]\\w+)*|\\S', text): tokens.append(match.group()) start_token_idx_to_text_idx.append(match.start()) end_token_idx_to_text_idx.append(match.end()) else: tokens = text # already tokenized all_tokens.append(tokens) all_start_token_idx_to_text_idx.append(start_token_idx_to_text_idx) all_end_token_idx_to_text_idx.append(end_token_idx_to_text_idx) input_x = [{\"tokenized_text\": tk, \"ner\": None} for tk in all_tokens] if ner is not None: for i, x in enumerate(input_x): x['ner'] = ner[i] if ground_truth_relations and ground_truth_relations[0] is not None: assert len(ground_truth_relations) == len(texts), f\"Number of texts ({len(texts)}) and number of ground truth relations ({len(ground_truth_relations)}) do not match.\" for i, x in enumerate(input_x): x['relations'] = ground_truth_relations[i] ner_positions = [[ent[0], ent[1]] for ent in x['ner']] for relation in x['relations']: assert relation[\"head\"][\"position\"] in ner_positions, f\"Head position {relation['head']['position']} not found in ner positions {ner_positions}\" assert relation[\"tail\"][\"position\"] in ner_positions, f\"Tail position {relation['tail']['position']} not found in ner positions {ner_positions}\" return_loss = True x = self.collate_fn(input_x, relation_types=labels, device=self.device) assert all([l in labels for l in x['classes_to_id'][0].keys()]), ( f\"Labels mismatch after collate function: {labels} != {x['classes_to_id'][0].keys()}. \" f\"`config.fixed_relation_types` is likely wrong\" ) outputs = self.predict(x, flat_ner=flat_ner, threshold=threshold, ner=ner, return_loss=return_loss) if return_loss: predictions = outputs[\"predictions\"] loss_info = outputs[\"loss\"] else: predictions = outputs # retrieve top_k predictions (if top_k > -1) if top_k > 0: top_k_outputs = [] for i, output in enumerate(predictions): # sort output by score output = sorted(output, key=lambda x: x[2], reverse=True) rels = [] position_set = {} # track all position predictions to take top_k predictions for rel in output: (head_pos, tail_pos), pred_label, score = rel hashable_positions = (tuple(head_pos), tuple(tail_pos)) if hashable_positions not in position_set: position_set[hashable_positions] = 0 if position_set[hashable_positions] < top_k: rels.append(rel) position_set[hashable_positions] += 1 top_k_outputs.append(rels) predictions_final = top_k_outputs else: predictions_final = predictions all_relations = [] for i, output in enumerate(predictions_final): rels = [] for (head_pos, tail_pos), pred_label, score in output: # +1 to indices to restore spaCy tokenizat