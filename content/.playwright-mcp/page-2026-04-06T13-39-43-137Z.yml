dictions for metrics calculation batch_predictions_formatted = [] for i, output in enumerate(batch_preds): # sort output by score output = sorted(output, key=lambda x: x[2], reverse=True) rels = [] position_set = {} # track all position predictions to take top_k predictions for (head_pos, tail_pos), pred_label, score in output: hashable_positions = (tuple(head_pos), tuple(tail_pos)) if hashable_positions not in position_set: position_set[hashable_positions] = 0 if position_set[hashable_positions] < top_k: rel = { 'head' : {'position': head_pos}, 'tail' : {'position': tail_pos}, 'relation_text': pred_label, 'score': score, } rels.append(rel) position_set[hashable_positions] += 1 batch_predictions_formatted.append(rels) all_preds[thresh].extend(batch_predictions_formatted) pbar.update(1) best_threshold = None best_out, best_metric_dict = None, None for thresh, preds in all_preds.items(): evaluator = RelEvaluator(all_trues[thresh], preds, dataset_name=dataset_name) out, metric_dict = evaluator.evaluate() if best_out is None or metric_dict[self.threshold_search_metric] > best_metric_dict[self.threshold_search_metric]: best_out = out best_metric_dict = metric_dict best_threshold = thresh best_metric_dict[\"best_threshold\"] = best_threshold if return_preds: return best_out, best_metric_dict, all_preds return best_out, best_metric_dict @classmethod def _from_pretrained( cls, *, model_id: str, revision: Optional[str], cache_dir: Optional[Union[str, Path]], force_download: bool, local_files_only: bool, token: Union[str, bool, None], proxies: Optional[Dict] = None, resume_download: bool = False, map_location: str = \"cpu\", strict: bool = False, **model_kwargs, ): if 'glirel_beta' in model_id: assert int(glirel.__version__.split('.')[0]) == 0, f\"glirel_beta is only compatible with glirel<1.0.0. Detected version: {glirel.__version__}\" # Use \"pytorch_model.bin\" and \"glirel_config.json\" model_file = Path(model_id) / \"pytorch_model.bin\" hf_hub_kwargs = dict( revision=rev